version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  houseoftaaga-db:
    image: postgres:16-alpine
    container_name: houseoftaaga-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-houseoftaaga}
      POSTGRES_USER: ${POSTGRES_USER:-taaga_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taaga_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taaga_admin} -d ${POSTGRES_DB:-houseoftaaga}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - houseoftaaga-net

  # ==========================================
  # 2. Node.js Express REST API Service
  # ==========================================
  houseoftaaga-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: houseoftaaga-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      POSTGRES_HOST: houseoftaaga-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-houseoftaaga}
      POSTGRES_USER: ${POSTGRES_USER:-taaga_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taaga_secure_pass_2026}
    volumes:
      - uploads_data:/app/uploads
      - store_data:/app/data
    depends_on:
      houseoftaaga-db:
        condition: service_healthy
    networks:
      - houseoftaaga-net

  # ==========================================
  # 3. Nginx Web & Reverse Proxy Service
  # ==========================================
  houseoftaaga-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: houseoftaaga-web
    restart: unless-stopped
    ports:
      # Host HTTP Port on VPS (mapped to container's internal port 80).
      # If port 3050 is in use by another app on your VPS, change PORT in .env
      - "${PORT:-3050}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - houseoftaaga-api
    labels:
      - "project=houseoftaaga"
    networks:
      - houseoftaaga-net

volumes:
  postgres_data:
    name: houseoftaaga_postgres_data
  uploads_data:
    name: houseoftaaga_uploads_data
  store_data:
    name: houseoftaaga_store_data

networks:
  houseoftaaga-net:
    name: houseoftaaga-net
    driver: bridge
